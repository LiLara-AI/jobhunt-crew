<!DOCTYPE html>
<html lang="{{cv.lang}}" dir="{{cv.dir}}">
<head>
<meta charset="utf-8">
<title>{{cv.name}} — CV</title>
<style>
  @page { size: A4; margin: 15mm; }
  * { box-sizing: border-box; }
  body { font-family: Calibri, Arial, sans-serif; font-size: 10.5pt; color: #1a1a1a; line-height: 1.45; margin: 0; }
  h1 { font-size: 20pt; margin: 0 0 2px; }
  .title { font-size: 12pt; color: #444; margin: 0 0 4px; }
  .contact { font-size: 9.5pt; color: #555; margin: 0 0 10px; }
  h2 { font-size: 12pt; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid #999; margin: 14px 0 6px; padding-bottom: 2px; }
  h3 { font-size: 11pt; margin: 8px 0 0; }
  p { margin: 0 0 4px; }
  .meta { color: #555; font-size: 9.5pt; font-style: italic; }
  ul { margin: 4px 0 8px; padding-inline-start: 18px; }
  li { margin: 2px 0; }
  h2, h3, .meta { break-after: avoid; }
  li { break-inside: avoid; }
  [dir="rtl"] body { text-align: right; }
</style>
</head>
<body>
  <!-- The cv.html placeholder below is rendered by DocGenerator (lib/honest-cv/doc-generator.js): header with contact details,
       Professional Summary, Experience grouped per employer (newest first, with dates), Education,
       Certifications, Skills. Plain headings, paragraphs and lists only, so ATS parsers can read it. -->
  {{cv.html}}
</body>
</html>
